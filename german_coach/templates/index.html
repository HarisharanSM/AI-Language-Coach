<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI German Voice Coach</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; text-align: center; }
        button { background: #3498db; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: background 0.2s; margin: 10px 5px; }
        button:hover { background: #2980b9; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        #recordBtn { background: #e74c3c; }
        #recordBtn:hover { background: #c0392b; }
        #recordBtn.recording { background: #27ae60; animation: pulse 1.5s infinite; }
        .script-box { background: #eef2f3; border-left: 5px solid #3498db; padding: 20px; border-radius: 6px; margin: 20px 0; min-height: 80px; }
        .turn-indicator { font-weight: bold; text-transform: uppercase; color: #7f8c8d; font-size: 14px; margin-bottom: 5px; }
        .english-line { font-size: 22px; color: #2c3e50; font-weight: 500; }
        .live-log { background: #fdfefe; border: 1px solid #e2e8f0; height: 150px; overflow-y: auto; padding: 15px; border-radius: 6px; font-size: 14px; }
        .feedback-box { margin-top: 30px; padding: 20px; border-top: 2px solid #e2e8f0; }

        /* Toggle Switch Styling layout components */
        .mode-container { display: flex; justify-content: center; align-items: center; margin: 15px 0; background: #f8fafc; padding: 10px; border-radius: 8px; }
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; margin: 0 10px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2cc56f; }
        input:checked + .slider:before { transform: translateX(26px); }
        .mode-label { font-weight: 600; color: #475569; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🇩🇪 German Voice Coach</h1>
    <p style="text-align: center; color: #666;">Practice speaking your lines based on the English prompts!</p>
    
    <div style="text-align: center;">
        <button id="startSessionBtn">Generate New Scenario Script</button>
        <button id="endSceneBtn" style="background-color: #718096; display: none;">End Scene & Get Feedback</button>
    </div>

    <!-- Toggle Switch Component -->
    <div class="mode-container">
        <span class="mode-label" id="scriptedLabel" style="color: #3498db;">Scripted Roleplay</span>
        <label class="switch">
            <input type="checkbox" id="modeToggle">
            <span class="slider"></span>
        </label>
        <span class="mode-label" id="freeLabel">Free Speech Mode</span>
    </div>

    <div style="text-align: center;">
        <button id="recordBtn" disabled>Click to Speak German</button>
    </div>

    <div class="script-box">
        <div class="turn-indicator" id="promptIndicator">Your English Prompt:</div>
        <div id="currentPrompt" class="english-line">Click "Generate New Scenario Script" to begin...</div>
    </div>

    <h3>Live Conversation Log</h3>
    <div id="liveLog" class="live-log"></div>

    <div id="feedbackContainer" class="feedback-box" style="display: none;">
        <h2>Evaluation & Corrections</h2>
        <div id="feedbackContent"></div>
    </div>
</div>

<script>
    let script = [];
    let currentIdx = 0;
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    const startSessionBtn = document.getElementById('startSessionBtn');
    const endSceneBtn = document.getElementById('endSceneBtn');
    const recordBtn = document.getElementById('recordBtn');
    const modeToggle = document.getElementById('modeToggle');
    const currentPrompt = document.getElementById('currentPrompt');
    const promptIndicator = document.getElementById('promptIndicator');
    const liveLog = document.getElementById('liveLog');
    const feedbackContainer = document.getElementById('feedbackContainer');
    const feedbackContent = document.getElementById('feedbackContent');

    // Dynamic UI State Adjustment logic 
    modeToggle.onchange = async () => {
        // 1. Wipe frontend logs and hide previous feedback reports
        liveLog.innerHTML = "";
        feedbackContainer.style.display = "none";
        feedbackContent.innerHTML = "";

        // 2. Fire an async request to wipe backend transcript memory arrays
        try {
            await fetch('/clear_session', { method: 'POST' });
        } catch (err) {
            console.error("Failed to clear backend session:", err);
        }

        // 3. Keep the speak button accessible if a script has been loaded
        if (script.length > 0) {
            recordBtn.disabled = false;
        }

        // 4. Update UI labels and instructions based on the active mode
        if (modeToggle.checked) {
            document.getElementById('freeLabel').style.color = '#2cc56f';
            document.getElementById('scriptedLabel').style.color = '#475569';
            endSceneBtn.style.display = "inline-block";
            promptIndicator.innerText = "Scenario Instructions:";
            currentPrompt.innerText = "Speak completely freely in German! Respond contextually based on the chosen theme setting. Click 'End Scene' to evaluate.";
        } else {
            document.getElementById('scriptedLabel').style.color = '#3498db';
            document.getElementById('freeLabel').style.color = '#475569';
            endSceneBtn.style.display = "none";
            promptIndicator.innerText = "Your English Prompt:";
            
            if (script.length > 0) {
                currentIdx = 0; // Reset index to the start of the script
                displayNextUserPrompt();
            } else {
                recordBtn.disabled = true;
                currentPrompt.innerText = "Click 'Generate New Scenario Script' to begin...";
            }
        }
    };
    
    startSessionBtn.onclick = async () => {
        currentPrompt.innerText = "Generating scenarios via Gemini...";
        feedbackContainer.style.display = "none";
        liveLog.innerHTML = "";
        recordBtn.disabled = true; // Temporary lock during generation
        
        const response = await fetch('/generate_script', { method: 'POST' });
        const data = await response.json();
        
        script = data.script;
        currentIdx = 0;
        
        liveLog.innerHTML = `<p style="color: #7f8c8d; font-style: italic;">🎯 Loaded Topic Module ${data.topic_id}: ${data.topic_name}</p><hr>`;
        
        // Explicitly enable button right after script variables populate
        recordBtn.disabled = false;
        
        // Trigger UI update logic
        modeToggle.onchange();
    };

    function displayNextUserPrompt() {
        if (currentIdx < script.length) {
            while (currentIdx < script.length && script[currentIdx].speaker !== 'User') {
                currentIdx++;
            }
            if (currentIdx < script.length) {
                currentPrompt.innerText = script[currentIdx].english;
            } else {
                finishRoleplay();
            }
        } else {
            finishRoleplay();
        }
    }

    // Consolidated recording logic used for BOTH Scripted and Free modes
    recordBtn.onclick = async () => {
        if (!isRecording) {
            audioChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
            
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };
            
                mediaRecorder.onstop = sendAudioFileToServer;
            
                mediaRecorder.start();
                isRecording = true;
                recordBtn.classList.add('recording');
                recordBtn.innerText = "Recording... Click to Stop & Send";
            } catch (err) {
                console.error("Microphone access error:", err);
                currentPrompt.innerText = "❌ Cannot access microphone. Check browser settings!";
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.classList.remove('recording');
            recordBtn.innerText = "Click to Speak German";
        }
    };

    async function sendAudioFileToServer() {
        currentPrompt.innerText = "Analyzing audio data on backend server...";
    
        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
        const formData = new FormData();
        formData.append('audio', audioBlob, 'input.wav');
        formData.append('mode', modeToggle.checked ? 'FREE' : 'SCRIPTED');

        try {
            const response = await fetch('/process_audio', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            // Render output items directly to screen log
            liveLog.innerHTML += `<p><strong>👤 You:</strong> ${data.user_transcription}</p>`;
            if (data.ai_response_german) {
                liveLog.innerHTML += `<p style="color: #2980b9;"><strong>🤖 AI Partner:</strong> ${data.ai_response_german}</p>`;
                speakGerman(data.ai_response_german);
            }
            liveLog.scrollTop = liveLog.scrollHeight;

            if (modeToggle.checked) {
                currentPrompt.innerText = "Speak completely freely in German! Respond contextually based on the topic setup.";
            } else {
                if (data.is_finished) {
                    finishRoleplay();
                } else {
                    currentIdx = data.next_turn_idx;
                    displayNextUserPrompt();
                }
            }
        } catch (err) {
            console.error("Backend error:", err);
            currentPrompt.innerText = "Error transmitting audio data to server.";
        }
    }

    function speakGerman(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        window.speechSynthesis.speak(utterance);
    }

    endSceneBtn.onclick = () => {
        finishRoleplay();
    };

    async function finishRoleplay() {
        currentPrompt.innerText = "Scene completed! Compiling Coach's notes...";
        recordBtn.disabled = true;
        endSceneBtn.style.display = "none";
        
        const response = await fetch('/get_feedback', { method: 'POST' });
        const data = await response.json();
        
        feedbackContent.innerHTML = data.feedback_html;
        feedbackContainer.style.display = "block";
        currentPrompt.innerText = "Check your feedback report below!";
    }
</script>
</body>
</html>
